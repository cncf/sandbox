name: Upcoming Sandbox Review Auto-Assign Reviewers

# Two jobs share this file:
#   1. assign   - cron every 15 min: assigns TOC reviewers to Sandbox issues
#                 in the Upcoming column on cncf/projects/14. Skips issues
#                 carrying the `gitvote` label.
#   2. unassign - fires on `issues.labeled` when the `gitvote` label is added:
#                 strips TOC roster members from the issue's assignees (single
#                 shot; leaves non-roster assignees such as the applicant).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log planned assignments without applying them'
        required: false
        type: boolean
        default: false
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign:
    name: Assign reviewers to Upcoming issues
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: upcoming-auto-assign-assign
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-save js-yaml@4.1.0

      # Token must have: contents:read on cncf/people (roster), org read:project on cncf (project 14), issues:write on cncf/sandbox.
      - name: Run auto-assign
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        with:
          github-token: ${{ secrets.ONBOARDING_MONITOR_TOKEN }}
          script: |
            const path = require('path');
            const scriptPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'assign-upcoming-reviewers.js');
            const { assignUpcomingReviewers } = require(scriptPath);

            const dryRun = process.env.DRY_RUN === 'true';

            try {
              await assignUpcomingReviewers(github, context, { dryRun });
            } catch (error) {
              console.error('❌ Auto-assign failed:', error);
              core.setFailed(error.message);
            }

  unassign:
    name: Unassign TOC reviewers on gitvote label
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'gitvote'
    runs-on: ubuntu-latest
    concurrency:
      # Shared with `assign` to prevent a race where the cron job assigns TOC members
      # after unassign has already run for the same issue.
      group: upcoming-auto-assign-assign
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-save js-yaml@4.1.0

      # Token must have: contents:read on cncf/people (roster) and issues:write on cncf/sandbox.
      - name: Run unassign
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ONBOARDING_MONITOR_TOKEN }}
          script: |
            const path = require('path');
            const scriptPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'unassign-vote-reviewers.js');
            const { unassignVoteReviewers } = require(scriptPath);

            try {
              await unassignVoteReviewers(github, context);
            } catch (error) {
              console.error('❌ Unassign failed:', error);
              core.setFailed(error.message);
            }
